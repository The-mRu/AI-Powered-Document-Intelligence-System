server {
  listen 80;
  client_max_body_size 600m;          # uploads up to the backend's 500 MB limit
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {                    # same-origin proxy: no CORS needed in this setup
    proxy_pass http://api:8000;
    proxy_read_timeout 300s;
    proxy_request_buffering off;
  }
  location / {
    try_files $uri /index.html;
  }
}
